name: CI/CD

# PRs: lint -> typecheck -> test -> build+scan (no push, no deploy).
# Pushes to main: the same, then push to ghcr.io (:sha + :latest) and
# deploy to the VM. Pushes of a `vX.Y.Z` tag (Phase 20, docs/UPGRADING.md):
# the same, then push to ghcr.io (:vX.Y.Z only — never :latest, so cutting
# a release tag against an older commit than main's current tip can't move
# :latest backward) but never deploy — a tag push doesn't necessarily
# happen from the VM's actual current commit, only `main` pushes trigger
# deploy.
# Each job only starts if the one before it succeeded (`needs:`) — a
# broken lint stops everything downstream, including any deploy.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `../shared` and `../scripts` too: neither has a venv of its own and
      # both would otherwise go unlinted, while
      # .claude/hooks/fast_gates.sh lints them mid-session. Same as
      # `just lint`.
      - run: cd api && uv run ruff check . ../shared ../scripts ../examples
      - run: cd worker && uv run ruff check .
      - run: cd demo-services && uv run ruff check .
      - run: cd mcp_server && uv run ruff check .
      # Phase 28: the Python extractor plugin. Linted here rather than
      # in the `cli` job below, so scripts/check_scan_coverage.py sees
      # one consistent ruff root list across the justfile and CI --
      # which scripts/tests/test_scan_coverage.py asserts.
      - run: cd extractors/python && uv run ruff check .

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase 22's two invariant checks below diff against
          # origin/main...HEAD -- the default shallow (depth-1) checkout
          # has no local `main`/`origin/main` history at all, only the
          # exact commit under test, so that diff would silently compare
          # against nothing. Full history costs more checkout time but
          # is what a correct diff needs.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `../shared` too — see the ruff step's comment.
      - run: cd api && uv run pyright . ../shared
      - run: cd worker && uv run pyright
      - run: cd demo-services && uv run pyright
      - run: cd mcp_server && uv run pyright
      # The RAG/anomaly-detection module-isolation contract (CLAUDE.md) —
      # enforced here, not just documented, same as `just lint-imports`.
      - run: cd worker && uv run lint-imports
      # worker/app/db.py hand-mirrors a subset of api/app/db/models.py's
      # columns (CLAUDE.md: worker and api are separate uv projects, no
      # shared ORM) — this catches the two drifting silently instead of
      # relying on someone remembering to update both by hand.
      - run: uv run --project api python scripts/check_schema_drift.py
      # Phase 26 (docs/DIAGNOSTIC_PLAN.md): a package declared
      # deterministic in .claude/rules/determinism.md that imports an LLM
      # or embedding client. Complements `lint-imports` above rather than
      # duplicating it -- import-linter sees one uv project's installed
      # import graph, this walks source text across every project,
      # including packages with no venv of their own.
      - run: uv run --project api python scripts/check_no_llm_imports.py

      # Phase 27, standing invariant 9: a check that never reads a file
      # is not a gate for that file. Two blind spots (just lint missing
      # scripts/, the subject lint missing api/tests/) each hid a real
      # violation inside a green gate, so the coverage of a check is now
      # itself checked. Offline and instant -- no container needed.
      - name: Check scan coverage
        run: uv run --project api python scripts/check_scan_coverage.py
      # Phase 22 (docs/AI_NATIVE_PLAN.md): a declared "must change
      # together" pair (scripts/coupled_files.yaml) that changed on only
      # one side. Checked against the PR's committed diff, not a working
      # tree (a CI checkout has no uncommitted edits to look at) — the
      # real-time version of this same check runs via
      # .claude/hooks/check_invariants.sh mid-session; this is the
      # actual gate for a commit that happened outside a hook-covered
      # session (a human editing directly, or a hook that failed to
      # fire).
      - run: uv run --project api python scripts/check_coupled_files.py --base origin/main
      # A migration whose upgrade()/downgrade() aren't structurally
      # symmetric (same phase). Computes the changed-migration file list
      # itself against origin/main...HEAD instead of relying on the
      # script's own no-argument default (which diffs against a local
      # `main` ref that doesn't exist on a CI runner and would silently
      # check zero files, not fail loudly) — an empty list here is a
      # real "no migrations changed," not a silently-skipped check.
      - name: Check migration symmetry
        run: |
          FILES=$(git diff --name-only origin/main...HEAD -- api/migrations/versions/)
          if [ -n "$FILES" ]; then
            uv run --project api python scripts/check_migration_symmetry.py $FILES
          else
            echo "No migration files changed."
          fi

  # Phase 28 (docs/DIAGNOSTIC_PLAN.md): the Go CLI and the two extractor
  # plugins.
  #
  # Its own job rather than steps inside lint/typecheck, because it needs
  # a different toolchain entirely (Go, and Node for the JS extractor)
  # and a failure here should read as "the CLI is broken" rather than
  # being buried among ruff output. It hangs off `lint` in parallel with
  # `typecheck`: the two share no code and neither gates the other.
  #
  # CGO_ENABLED=0 everywhere. It is what makes the result one static
  # binary with no libc dependency -- acceptance criterion 5, and the
  # reason `curl | sh` can work at all. It is also why the CLI has no
  # tree-sitter dependency: the Go binding needs cgo, which would undo
  # exactly this.
  cli:
    needs: lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # gofmt and go vet are the whole Go lint story here. A separate
      # linter (golangci-lint) is a real option and is deliberately not
      # taken yet: the Go surface is a few thousand lines, and adding a
      # tool with its own config file before there is anything for it to
      # find is the kind of setup that never gets tuned.
      - name: gofmt
        run: |
          cd cli
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: cd cli && go vet ./...
      # Before `go test`, not after: internal/check's end-to-end test runs
      # the real Node extractor, which imports @babel/parser. Without its
      # node_modules it dies on import, the pipeline turns that into a
      # Skip (by design), and the frontend's facts silently vanish. The
      # Python extractor needs no equivalent: `uv run --project` syncs on
      # first use.
      - name: Install the Node extractor's dependencies
        run: cd extractors/node && npm ci
      # Includes the golden-file tests over the fixture corpus and the
      # conformance tests against shared/tests/*.json -- the same two
      # fixtures the Python and JavaScript implementations read, which is
      # what keeps three implementations of subject construction from
      # drifting.
      - name: go test
        run: cd cli && go test ./...

      # Phase 30 field 13: `culprit diff` end to end against two real
      # Compose projects -- a real Postgres per environment, real image
      # digests from a real pull, INTENT from the real extractors. The
      # `go test ./...` above skips it (it says NOT RUN) because it needs
      # Docker; ubuntu-latest has Docker, so it runs here. `just
      # cli-test-docker` is the same thing locally.
      - name: Compose end-to-end (culprit diff against real containers)
        run: cd cli && CULPRIT_DOCKER_TESTS=1 go test ./cmd/culprit -run TestEnvironmentDiffAgainstRealContainers -v

      # Every released platform, built here rather than only at tag time,
      # so a change that breaks the darwin/arm64 build is caught on the
      # PR that makes it instead of on release day.
      - name: Cross-compile every release target
        run: |
          cd cli
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/culprit
            echo "built $target"
          done

      - name: pytest (culprit-extract-python)
        run: cd extractors/python && uv run pytest
      - name: pyright (culprit-extract-python)
        run: cd extractors/python && uv run pyright
      - name: node --test (culprit-extract-node)
        run: cd extractors/node && npm test

  # Culprit checks Culprit (Phase 29 field 5).
  #
  # Dogfooding is the cheapest continuous eval available. This repository
  # is a real multi-language system - an OpenAPI surface, an ORM, a
  # 23-revision migration chain, a React frontend calling the API, about
  # five hundred facts across five components - so if the comparator
  # starts inventing findings, it invents them here first, on the pull
  # request that caused it.
  #
  # Its own job rather than a step in `cli` above: it needs the Python
  # extractor installed into api's environment to introspect anything,
  # and a failure here means something different from a unit-test
  # failure. It says the product is wrong about a real repository.
  self-check:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploading a SARIF file needs this. It is what turns a finding
      # into an annotation on the changed line of a pull request, which
      # is most of the adoption story for a CI tool - and it would be odd
      # to ship that and then not use it ourselves.
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the extractor plugins
        run: |
          cd api && uv sync --all-extras
          cd ../frontend && npm ci
          # The root culprit.yaml runs the Node extractor from frontend/,
          # but its @babel/parser resolves from extractors/node/, not from
          # frontend/node_modules.
          cd ../extractors/node && npm ci

      # `continue-on-error`, deliberately, and only on this step.
      #
      # A finding here should be visible on the pull request, and it
      # should not be able to block an unrelated change from merging on
      # the day the tool first gets something wrong about our own
      # repository. The gate that *can* fail the build is the false
      # positive corpus in `cli/testdata/faults/`, which runs in the
      # `cli` job above and is an exact assertion. This step is the
      # noisier, more valuable, less trustworthy signal, and it is
      # treated as one.
      #
      # If it stays green for a few releases, remove this line.
      # `just self-check-sarif`, not the binary directly.
      #
      # The recipe carries the placeholder environment
      # `api/app/*/config.py` needs at import time, and introspecting a
      # FastAPI app means importing it. Without it the extractor reports
      # `KeyError: JWT_SECRET_KEY` and skips `http_routes` and
      # `db_schema` — the two rank-90 enumerating sources — so the job
      # would check a fact set with the route table and the ORM schema
      # missing and report a confident, meaningless zero.
      #
      # That is this product's own failure mode, and it shipped in this
      # job until the Phase 29 audit caught it. Invoking through `just`
      # is what keeps the two from drifting apart again.
      # The placeholder environment, duplicated from the justfile's
      # `_self-check-env` recipe rather than shelled through `just` —
      # no other job here needs `just`, and adding an action to install
      # it is supply-chain surface for one step. The duplication is held
      # in step by `scripts/tests/test_self_check_env.py`, which parses
      # both this file and the justfile and fails if they diverge. Same
      # technique, and same reason, as the stop hook's exclusion list.
      - name: culprit check (this repository)
        id: check
        env:
          JWT_SECRET_KEY: culprit-intent-extraction-placeholder
          AGENT_AUTOMATION_TOKEN: culprit-intent-extraction-placeholder
          INGEST_GATEWAY_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          API_READER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          REGISTRY_ADMIN_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          AUTH_SERVICE_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          POSTMORTEM_WRITER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          FACT_WRITER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          CAPTURE_WRITER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          PROBE_WRITER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
        run: |
          cd cli
          go run ./cmd/culprit check             -f ../culprit.yaml             --fail-on=breaks_request_path             --format sarif --output ../culprit.sarif

      # Run again for the log. The SARIF file went to disk, so without
      # this the job's output says nothing a person reading it can use.
      - name: culprit check (human-readable, including coverage)
        if: always()
        env:
          JWT_SECRET_KEY: culprit-intent-extraction-placeholder
          AGENT_AUTOMATION_TOKEN: culprit-intent-extraction-placeholder
          INGEST_GATEWAY_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          API_READER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          REGISTRY_ADMIN_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          AUTH_SERVICE_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          POSTMORTEM_WRITER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          FACT_WRITER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          CAPTURE_WRITER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
          PROBE_WRITER_DATABASE_URL: postgresql+asyncpg://localhost:5432/culprit-intent-placeholder
        run: |
          cd cli
          go run ./cmd/culprit check -f ../culprit.yaml --unverifiable --fail-on=any || true

      - name: Upload SARIF as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culprit-sarif
          path: culprit.sarif
          if-no-files-found: error

  # Phase 30 field 13: "Capture against ... a kind cluster." The
  # Kubernetes adapter reads a real API server here: a Deployment with a
  # literal env value, a secretKeyRef, and envFrom over a ConfigMap and a
  # Secret, whose Pod reports a real image digest. The recorded-output
  # tests in internal/capture pin the parsing; this pins that the
  # parsing matches what a cluster actually returns. Its own job because
  # a cluster takes a minute to come up and a failure here means
  # something specific.
  kind-capture:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: cli/go.sum
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: culprit-capture
      - name: Apply the capture fixture
        run: |
          kubectl apply -f cli/testdata/kind/fixture.yaml
          kubectl -n culprit-capture rollout status deployment/orders-api --timeout=180s
      - name: Capture it
        run: cd cli && CULPRIT_KIND_TESTS=1 CULPRIT_KIND_CONTEXT=kind-culprit-capture go test ./internal/capture -run TestKubernetesCaptureAgainstKind -v

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    # ubuntu-latest runners have Docker pre-installed and running, which
    # is all testcontainers-python needs to spin up real Postgres/Redis
    # for any integration test that uses it — no extra setup. (As of
    # this workflow, no test in this repo actually exercises
    # testcontainers yet — see CLAUDE.md; every current test is a pure
    # unit test. This job runs real pytest either way, and will pick up
    # testcontainers-backed tests automatically the day one is added.)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pytest (api)
        # Dummy, CI-only values — not real secrets, and not GitHub
        # Actions secrets either (see Phase 11's security requirement:
        # the only real secret CI needs anywhere in this workflow is the
        # SSH deploy key, used only in the deploy job below). Exist
        # purely to satisfy required-env-var reads at import time.
        # OPERATOR_USERNAME/OPERATOR_PASSWORD_HASH used to need dummy
        # values here too (Phase 9) — Phase 16 moved them to being
        # migration-time-only inputs (see
        # api/migrations/versions/fbf4cb16570a_create_users_table.py),
        # no longer read anywhere at import time, so this job no longer
        # needs them at all. INGEST_GATEWAY_DATABASE_URL was missing here
        # since Phase 14 introduced api/app/ingest_gateway/config.py's
        # required os.environ["INGEST_GATEWAY_DATABASE_URL"] read — any
        # test collecting app.ingest_gateway.auth (imported by
        # test_ingest_gateway_key_refresh.py directly and by
        # test_ingest_gateway_limits.py via app.ingest_gateway.main) has
        # been failing to even collect in CI since then; this job's own
        # run history shows every push to main failing from Phase 14's
        # merge onward. Never a real connection string here — nothing in
        # this job actually connects to a database.
        env:
          JWT_SECRET_KEY: ci-test-jwt-secret-not-a-real-secret
          INGEST_GATEWAY_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          # Phase 21: test_memory_api.py's require_auth_or_agent tests
          # POST as the automation caller, matching this literal value
          # (see that file's own AGENT_TOKEN constant). Dummy, CI-only,
          # not a real secret -- same reasoning as JWT_SECRET_KEY above.
          AGENT_AUTOMATION_TOKEN: dev-agent-automation-token
        run: cd api && uv run pytest
      - name: pytest (worker)
        run: cd worker && uv run pytest
      - name: pytest (mcp_server)
        run: cd mcp_server && uv run pytest

  # Phase 27, standing invariant 8: every migration round-trips against
  # a real database in CI -- upgrade head, seed representative rows,
  # downgrade base, upgrade head again.
  #
  # Its own job rather than a step in `test` because it needs Docker and
  # takes ~40s, and because a failure here should be legible as "the
  # migrations do not round-trip" rather than buried in a pytest summary.
  # It hangs off `typecheck` in parallel with `test`, not after it: the
  # two are independent, and the migration chain is exactly the thing you
  # want to know about early.
  #
  # scripts/check_migration_symmetry.py (in the typecheck job) is NOT a
  # substitute. It is a structural AST check and cannot see a
  # data-dependent defect -- it passed the Phase 26.1 downgrade bug both
  # before and after the fix. That is precisely why this job exists.
  migration-round-trip:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No secrets and no real connection strings: the script generates
      # its own throwaway role passwords against a container it destroys
      # on exit (Phase 11's security requirement -- the only real secret
      # anywhere in this workflow is the SSH deploy key).
      - name: Migration round trip
        run: uv run --project api python scripts/check_migration_round_trip.py

  build:
    needs: [test, migration-round-trip, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Every image is built and scanned in the same run. With the
      # default (true) the first failing scan cancels the rest, so
      # findings in different images surfaced one image per run.
      # Nothing is loosened: each scan still fails its own job.
      fail-fast: false
      matrix:
        # api/ and worker/ both depend on shared/ (culprit-shared, a
        # path dependency — see api/Dockerfile's comment), which is
        # outside their own directory, so they build from the repo root
        # instead of `context: ${{ matrix.image }}`. frontend/ has no
        # such dependency and keeps its own directory as context.
        include:
          - image: api
            context: .
            dockerfile: api/Dockerfile
          - image: worker
            context: .
            dockerfile: worker/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          # Phase 24 (docs/AI_NATIVE_PLAN.md): mcp_server has no
          # culprit-shared dependency (unlike api/worker), so its own
          # directory is a sufficient build context — see its own
          # Dockerfile's comment. Built, scanned, and pushed like every
          # other image here, but never wired into
          # docker-compose.prod.yml/deploy.sh (Out of scope) — a team
          # runs this themselves.
          - image: mcp_server
            context: mcp_server
            dockerfile: mcp_server/Dockerfile
          # Phase 30: the `culprit` binary on distroless, for the optional
          # capture agent in docker-compose.prod.yml (off by default, under
          # the `agent` profile). Built, Trivy-scanned and pushed like the
          # rest, which is the point of building it here rather than
          # leaving the agent pointing at an image nobody scans.
          - image: cli
            context: cli
            dockerfile: cli/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # frontend/src/lib/api-types.generated.ts is gitignored — it's
      # regenerated from api's live OpenAPI schema, same as local dev's
      # `just generate-types` (which `just frontend`/`frontend-build`
      # both depend on). frontend/Dockerfile's own build can't reach
      # api's Python at all (see its comments), so this has to happen
      # here, on the runner, before the Docker build step even starts —
      # otherwise `COPY . .` inside that build has nothing to copy and
      # `tsc -b` fails on the missing module. Only frontend needs any
      # of this; api and worker skip these three steps entirely.
      - name: Set up uv (frontend type generation only)
        if: matrix.image == 'frontend'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Dump api's OpenAPI schema
        if: matrix.image == 'frontend'
        # Same dummy, CI-only values as the pytest (api) step above —
        # app.main imports app.auth.config (JWT_SECRET_KEY, no default)
        # and, transitively via app.model.router ->
        # app.registry.service -> app.registry.keys ->
        # app.ingest_gateway.auth, app.ingest_gateway.config's
        # INGEST_GATEWAY_DATABASE_URL (also no default) — missing here
        # the same way it was missing from the pytest (api) step (see
        # that step's comment). dump_openapi_schema.py never actually
        # touches auth or ingest-gateway logic; this only exists to
        # satisfy both import-time reads. Phase 26 added the four
        # `*_DATABASE_URL` entries below for the same reason: those
        # config modules used to fall back to a committed
        # `<role>-dev-password` connection string when unset, and now
        # correctly refuse to import without a value. Nothing here
        # connects to a database — this step only serialises the
        # OpenAPI schema.
        env:
          JWT_SECRET_KEY: ci-test-jwt-secret-not-a-real-secret
          INGEST_GATEWAY_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          API_READER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          REGISTRY_ADMIN_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          AUTH_SERVICE_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          POSTMORTEM_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          FACT_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          CAPTURE_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          PROBE_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
        run: cd api && uv run python -m scripts.dump_openapi_schema > ../frontend/openapi.schema.json
      - name: Generate frontend types from schema
        if: matrix.image == 'frontend'
        run: cd frontend && npm ci && npm run generate-types

      - uses: docker/setup-buildx-action@v3

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/${{ matrix.image }}:ci
          build-args: |
            ${{ matrix.image == 'frontend' && 'VITE_API_URL=/api' || '' }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # Only pushes to ghcr.io on a push to main or a vX.Y.Z tag — PRs
      # stop here, image scanned but not published. GITHUB_TOKEN
      # (built-in, scoped to this repo) is all ghcr.io needs; no separate
      # registry credential.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        if: github.event_name == 'push'
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # main push: :sha + :latest, the existing continuous-deployment
      # behaviour deploy.sh/docker-compose.prod.yml's default IMAGE_TAG
      # depend on. Version tag push: :vX.Y.Z only — see the `on:` block
      # above for why :latest never moves from a tag build.
      - name: Tag and push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag local/${{ matrix.image }}:ci ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.sha }}
          docker tag local/${{ matrix.image }}:ci ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:latest
          docker push ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:latest

      - name: Tag and push (version tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag local/${{ matrix.image }}:ci ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.ref_name }}
          docker push ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.ref_name }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keeps the VM's copy of the compose file + deploy script current
      # with this commit. Does NOT touch infra/.env.prod — that's
      # created once, by hand, on the VM, and never overwritten by CI
      # (see infra/.env.prod.example's header comment).
      - name: Copy deploy files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "infra/docker-compose.prod.yml,infra/deploy.sh"
          target: "~/culprit"
          strip_components: 1

      # Runs ON the VM (infra/deploy.sh), not from this runner against a
      # remote DB: pull images -> alembic upgrade head -> restart ->
      # health check. See deploy.sh for why that order is load-bearing.
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/culprit
            chmod +x deploy.sh
            ./deploy.sh
