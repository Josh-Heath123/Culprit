name: Images

# Build every image and Trivy-scan it (CRITICAL/HIGH, blocking).
#
# Three ways in:
#   - called by ci-cd.yml on every pull request and push, which passes
#     `publish: true` only for a push to main or a vX.Y.Z tag;
#   - weekly, on main, so an advisory published against a pinned dependency
#     is found on main and fixed in its own small pull request, instead of
#     turning a waiting phase's CI red (docs/HANDOFF.md, the standing task
#     folded into Phase 32.2);
#   - by hand (Actions -> Images -> Run workflow).
#
# A scheduled or hand-started run publishes nothing and deploys nothing:
# `publish` is false unless a caller sets it, only the `publish` job can
# push and it runs only when `publish` is set, the build-and-scan job holds
# a read-only token, and this workflow has no deploy job at all.
on:
  workflow_call:
    inputs:
      publish:
        description: Push the scanned images to ghcr.io (main and version tags only).
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build and scan with a read-only token: the weekly and hand-started
  # runs, and every pull request, execute third-party actions (setup-uv,
  # build-push-action, trivy-action) with nothing that can write a package.
  build:
    runs-on: ubuntu-latest
    # Twice the slowest of the last ten green CI/CD runs before Phase 41
    # (44321940704 to 44390448565): frontend, 5.3 minutes in 44321940704,
    # rounded up to 5 (Phase 41).
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # Every image is built and scanned in the same run. With the
      # default (true) the first failing scan cancels the rest, so
      # findings in different images surfaced one image per run.
      # Nothing is loosened: each scan still fails its own job.
      fail-fast: false
      matrix:
        # api/ and worker/ both depend on shared/ (culprit-shared, a
        # path dependency — see api/Dockerfile's comment), which is
        # outside their own directory, so they build from the repo root
        # instead of `context: ${{ matrix.image }}`. frontend/ has no
        # such dependency and keeps its own directory as context.
        include:
          - image: api
            context: .
            dockerfile: api/Dockerfile
          - image: worker
            context: .
            dockerfile: worker/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          # Phase 24 (docs/AI_NATIVE_PLAN.md): mcp_server has no
          # culprit-shared dependency (unlike api/worker), so its own
          # directory is a sufficient build context — see its own
          # Dockerfile's comment. Built, scanned, and pushed like every
          # other image here, but never wired into
          # docker-compose.prod.yml/deploy.sh (Out of scope) — a team
          # runs this themselves.
          - image: mcp_server
            context: mcp_server
            dockerfile: mcp_server/Dockerfile
          # Phase 30: the `culprit` binary on distroless, for the optional
          # capture agent in docker-compose.prod.yml (off by default, under
          # the `agent` profile). Built, Trivy-scanned and pushed like the
          # rest, which is the point of building it here rather than
          # leaving the agent pointing at an image nobody scans.
          - image: cli
            context: cli
            dockerfile: cli/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # frontend/src/lib/api-types.generated.ts is gitignored — it's
      # regenerated from api's live OpenAPI schema, same as local dev's
      # `just generate-types` (which `just frontend`/`frontend-build`
      # both depend on). frontend/Dockerfile's own build can't reach
      # api's Python at all (see its comments), so this has to happen
      # here, on the runner, before the Docker build step even starts —
      # otherwise `COPY . .` inside that build has nothing to copy and
      # `tsc -b` fails on the missing module. Only frontend needs any
      # of this; api and worker skip these three steps entirely.
      - name: Set up uv (frontend type generation only)
        if: matrix.image == 'frontend'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Dump api's OpenAPI schema
        if: matrix.image == 'frontend'
        # Same dummy, CI-only values as the pytest (api) step above —
        # app.main imports app.auth.config (JWT_SECRET_KEY, no default)
        # and, transitively via app.model.router ->
        # app.registry.service -> app.registry.keys ->
        # app.ingest_gateway.auth, app.ingest_gateway.config's
        # INGEST_GATEWAY_DATABASE_URL (also no default) — missing here
        # the same way it was missing from the pytest (api) step (see
        # that step's comment). dump_openapi_schema.py never actually
        # touches auth or ingest-gateway logic; this only exists to
        # satisfy both import-time reads. Phase 26 added the four
        # `*_DATABASE_URL` entries below for the same reason: those
        # config modules used to fall back to a committed
        # `<role>-dev-password` connection string when unset, and now
        # correctly refuse to import without a value. Nothing here
        # connects to a database — this step only serialises the
        # OpenAPI schema.
        env:
          JWT_SECRET_KEY: ci-test-jwt-secret-not-a-real-secret
          INGEST_GATEWAY_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          API_READER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          REGISTRY_ADMIN_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          AUTH_SERVICE_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          POSTMORTEM_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          FACT_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          CAPTURE_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          PROBE_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          INVESTIGATION_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          AGENT_ADMIN_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          AGENT_REGISTRAR_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          AGENT_GATEWAY_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
          VERIFICATION_WRITER_DATABASE_URL: postgresql+asyncpg://ci-test:ci-test-not-a-real-secret@localhost:5432/ci-test
        run: cd api && uv run python -m scripts.dump_openapi_schema > ../frontend/openapi.schema.json
      - name: Generate frontend types from schema
        if: matrix.image == 'frontend'
        run: cd frontend && npm ci && npm run generate-types

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/${{ matrix.image }}:ci
          build-args: |
            ${{ matrix.image == 'frontend' && 'VITE_API_URL=/api' || '' }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # The agent image's promises (Phase 33): under 30 MB, a non-root
      # user, and `culprit agent` working with a read-only root filesystem
      # — refusing a task it holds no grant for, with an intact audit chain.
      - name: Agent image checks
        if: matrix.image == 'cli'
        run: bash scripts/check_agent_image.sh local/cli:ci

      # Phase 43 (D7, decision 5): the scanned image's software bill of
      # materials, written by the same Trivy, after the scan and apart from
      # it (the action keeps each call's settings to that call), for the
      # publish job to attest. CycloneDX. Written on every run, so a pull
      # request shows it can be; kept only when publishing.
      - name: SBOM of the scanned image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json

      # Hand the exact image that was scanned to the publish job, so what
      # is pushed is what Trivy passed, never a rebuild of it.
      - name: Save the scanned image for publishing
        if: inputs.publish
        run: docker save local/${{ matrix.image }}:ci | gzip > image-${{ matrix.image }}.tar.gz
      - name: Keep it, and its SBOM, for the publish job
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: |
            image-${{ matrix.image }}.tar.gz
            sbom-${{ matrix.image }}.cdx.json
          if-no-files-found: error
          retention-days: 1

  # Only on a push to main or a vX.Y.Z tag (and a hand-started deploy of
  # main) — the caller sets `publish`. The one job holding packages: write,
  # and it runs no build or scan action. GITHUB_TOKEN (built-in, scoped to
  # this repo) is all ghcr.io needs; no separate registry credential.
  #
  # Phase 43 (D7, decision 5): it attests each image it pushed, by the
  # pushed digest: build provenance and the SBOM the build job wrote, both
  # signed with this run's OIDC identity through Sigstore and stored beside
  # the image in ghcr.io; then `gh attestation verify` checks both in the
  # same job, so an attestation that does not verify fails the publish. The
  # two attestation permissions are this job's alone
  # (scripts/tests/test_ci_workflow.py holds every job's).
  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    # The floor: its slowest of the last ten green runs took 0.5 minutes.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, frontend, mcp_server, cli]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.image }}
      - name: Load the scanned image
        run: gunzip -c image-${{ matrix.image }}.tar.gz | docker load

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # main: :sha + :latest, the existing behaviour deploy.sh and
      # docker-compose.prod.yml's default IMAGE_TAG depend on. Version tag
      # push: :vX.Y.Z only — see ci-cd.yml's header for why :latest never
      # moves from a tag build.
      - name: Tag and push (main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag local/${{ matrix.image }}:ci ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.sha }}
          docker tag local/${{ matrix.image }}:ci ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:latest
          docker push ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:latest

      - name: Tag and push (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag local/${{ matrix.image }}:ci ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.ref_name }}
          docker push ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.ref_name }}

      # The digest the registry gave the image just pushed: what is attested
      # and verified, never a tag that can move. Fails if no push ran.
      - name: The pushed digest
        id: pushed
        run: |
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "local/${{ matrix.image }}:ci" \
            | grep -m1 "^ghcr.io/${REPO_LC}/${{ matrix.image }}@sha256:" | cut -d@ -f2)
          if [ -z "$digest" ]; then
            echo "no digest in ghcr.io for ${{ matrix.image }}: nothing was pushed" >&2
            exit 1
          fi
          echo "pushed ghcr.io/${REPO_LC}/${{ matrix.image }}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}
          subject-digest: ${{ steps.pushed.outputs.digest }}
          push-to-registry: true

      - name: Attest the image's SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}
          subject-digest: ${{ steps.pushed.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.cdx.json
          push-to-registry: true

      # Both attestations, checked where they were made: signed by a workflow
      # in this repository, for this digest. A failure fails the job.
      - name: Verify both attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="oci://ghcr.io/${REPO_LC}/${{ matrix.image }}@${{ steps.pushed.outputs.digest }}"
          gh attestation verify "$image" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$image" --repo "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom
