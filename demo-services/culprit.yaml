# The demo system, described declaratively (Phase 27, field 15).
#
# This replaces infra/demo-services.yaml, and it replaces
# shared/culprit_shared/services.py's DEMO_SERVICE_ADJACENCY, which was
# the last hardcoded copy of this topology in Python (Phase 27, field 6).
# Applied by docker-compose.quickstart.yml's one-shot `bootstrap` service
# via `apply_model.py`, and by `just apply-model demo-services/culprit.yaml`
# locally.
#
# It lives here, next to the services it describes, rather than at the
# repository root. Phase 27's field 10 says "culprit.yaml at repo root
# becomes the canonical model source" — that is the convention for a
# *user's* repository, where the root is the system being modelled. This
# repository's root is Culprit itself, which is not the system these
# three toy services make up. Putting it here keeps "the manifest sits at
# the root of the thing it describes" true, which is the rule the
# convention is actually for.
#
# Two things are deliberately different from the pre-Phase-27
# demo-services.yaml, and both are the point of the phase:
#
#   * `kind` is now stated. order-service, inventory-service and
#     payments-service are all services; if the demo ever grows a
#     database or a queue, that becomes expressible here rather than
#     being flattened into "another service".
#   * `criticality` is stated as on_request_path, which the old schema
#     could not record at all. Every edge here really is on the path a
#     POST /orders takes — see demo-services/order_service/main.py, which
#     calls both dependencies synchronously while handling the request.
#     That is what lets `GET /model/graph?symptom=order-service` return a
#     request path rather than a shrug.
#
# monitored_metrics is left empty on all three: "[] means score every
# metric seen" (Phase 14) is already right for the demo services' small,
# known metric set.
#
# Each edge is a call the code makes: order-service calls inventory-service
# and payments-service (order_service/main.py), and inventory-service reads
# its own database. Neither inventory-service nor payments-service calls
# anything over HTTP, so neither has an edge back to order-service. Until
# Q36 (2026-11-14) this file kept those two, copied from the undirected
# adjacency api/migrations/versions/635870479f4e_create_service_registry.py
# backfills; they were false INTENT, not a design choice. The migration is
# history and still backfills them on a fresh database; `apply-model`
# removes them, because they are culprit_yaml's and this file no longer
# lists them. A connection is directed; see docs/SELF_HOSTED_PLAN.md
# Phase 14's schema section.
version: 1
components:
  - name: order-service
    kind: service
    display_name: Order Service
    monitored_metrics: []
    connections:
      - to: inventory-service
        kind: http
        criticality: on_request_path
      - to: payments-service
        kind: http
        criticality: on_request_path

  - name: inventory-service
    kind: service
    display_name: Inventory Service
    monitored_metrics: []
    connections:
      # Phase 37 part 1: inventory-service's own database (P8). Only the
      # list route (GET /products) reads it; POST /orders — the fault
      # library's symptom — never does, so the edge is not on that request
      # path, and the walk from an order is unchanged. Phase 37 part 3
      # walks from the list route.
      - to: inventory-db
        kind: sql
        criticality: background

  - name: inventory-db
    kind: database
    display_name: Inventory database

  - name: payments-service
    kind: service
    display_name: Payments Service
    monitored_metrics: []

# --- Phase 37 part 3: the migrations, read as INTENT (Q33) -------------
#
# One extractor, for one component, for one kind of fact: inventory-service's
# Alembic migrations, read by the Python extractor statically. That is the
# INTENT plane of a missing index — "the migrations declare none" — and the
# walk cannot claim one without it.
#
# Why only this, when this file went without `extract:` until now: these
# three services share one uv project and import the sibling `shared/`
# package, so *importing* a service from its own directory fails on
# `import shared`, and rooting all three together would attribute every
# service's config keys to all three — a confidently wrong fact. Neither
# applies here. `--no-import` imports nothing of the demo's, and `want:
# [db_schema]` asks only for the schema, which the migration reader replays
# from the files with `ast`. The facts are on inventory-db, the database
# inventory-service connects to by its one sql edge (Q34).
#
# Run from a clone, the command is the repository's own extractor through
# uv. The fault library runs the same section inside the demo's containers,
# where there is no uv: it changes only the command (cli/cmd/culprit/
# faultlib_test.go, buildWalkBundle).
extract:
  extractors:
    - name: python
      command: ["uv", "run", "--project", "../../extractors/python", "culprit-extract-python", "--no-import"]
      want: [db_schema]
  components:
    inventory-service:
      root: inventory_service
      extractors: [python]

# The repository's own root `culprit.yaml` is where extraction is dogfooded
# in full — `api/` and `frontend/` are a real Python+React pair with a real
# layout. Otherwise this file is what it has always been: the demo system's
# *topology*, applied with `just apply-model`.

# --- Phase 31: probing the running demo stack -------------------------
#
# `environments:` exists here so Phase 31's acceptance criterion 1 is an
# executable command rather than a description:
#
#   just demo-up   # or: just quickstart
#   cd cli && go run ./cmd/culprit probe \
#       'connection:order-service->inventory-service' \
#       -f ../demo-services/culprit.yaml --env local
#
# Without it, `--env` cannot be passed, nothing is granted, and every
# probe correctly refuses — which is the permission model working, and
# also a demonstration of nothing. The audit of this phase found exactly
# that.
#
# `local` grants only the four read capabilities the network and HTTP
# probes need, against a stack on this machine. It grants no
# config.read.values, no db.rows.read, and there is no *.write
# capability to grant. `adapter: process` because the probe reads its
# own environment; probes dial from wherever the CLI runs, which for a
# local Compose stack is the published ports (see docs/LIMITS.md,
# "Probes run from wherever you run them").
environments:
  local:
    adapter: process
    # One component, because `process` captures the environment culprit
    # itself runs in and that belongs to exactly one. It does not limit
    # what can be probed: a probe's target comes from the command line,
    # and the grants below apply to the environment, not to this entry.
    components:
      order-service: {}
    grants:
      net.dns.resolve: true
      net.tcp.connect: true
      net.tls.inspect: true
      net.http.outbound: true
      # Phase 31.1: probe.config.present now has a data source. Run inside
      # a demo container (infra/docker-compose.probe-demo.yml mounts the
      # binary there), the process adapter reads that container's own
      # environment, so this answers "is INVENTORY_SERVICE_URL set where
      # order-service runs". Names only — no config.read.values.
      config.read.names: true

# Two vantages, one per environment, because the `process` adapter reads
# the environment of the one component culprit runs inside (Phase 30). The
# fault library (cli/cmd/culprit/faultlib_test.go) copies the binary into
# that container and runs `culprit diagnose --from <it>` there.
#
# health_path is /ready, not /health: /health is exempt from the demo's
# injected faults, so a request there succeeds whatever is wrong — the
# shallow check the walk must not be pointed at (docs/LIMITS.md).
  faults-order:
    adapter: process
    components: &order-vantage
      order-service:
        tokens:
          inventory-service: INVENTORY_TOKEN
    endpoints: &fault-endpoints
      order-service: { host: order-service, port: 8001 }
      inventory-service: { host: inventory-service, port: 8002, health_path: /ready }
      payments-service: { host: payments-service, port: 8003, health_path: /ready }
    grants: &token-grants
      net.dns.resolve: true
      net.tcp.connect: true
      net.http.outbound: true
      config.read.names: true
      # Inspecting order-service's own token, to check its audience, needs
      # this: it is that service's credential, read in memory and never
      # stored (Phase 33 part 1; config.read.values, which would store it,
      # does not satisfy it).
      config.inspect.values: [order-service/INVENTORY_TOKEN]
  # The same vantage without the token grant: the audience hypothesis is
  # refused, and the diagnosis is partial and says why.
  faults-order-ungranted:
    adapter: process
    components:
      order-service:
        tokens:
          inventory-service: INVENTORY_TOKEN
    endpoints: *fault-endpoints
    grants: &fault-grants
      net.dns.resolve: true
      net.tcp.connect: true
      net.http.outbound: true
      config.read.names: true
  faults-payments:
    adapter: process
    components:
      payments-service: {}
    endpoints: *fault-endpoints
    grants: *fault-grants
  # Phase 37 part 3: the database fault's vantage. The walk runs inside
  # inventory-service and reads statements and plans as Culprit's own
  # read-only role (CULPRIT_INVENTORY_STATS_DSN, in that container). No
  # db.metadata.read: the capture verification compares holds no schema, so
  # the index a fix adds is the change named, not a difference unexplained.
  faults-inventory:
    adapter: process
    components:
      inventory-service:
        database: {dsn_env: CULPRIT_INVENTORY_STATS_DSN}
    endpoints: *fault-endpoints
    grants:
      net.dns.resolve: true
      net.tcp.connect: true
      net.http.outbound: true
      config.read.names: true
      db.stats.read: true
      db.plan.read: true
  # Phase 39 part 2: the N+1 fault's vantage, the same as faults-inventory
  # and declared isolated: nothing but Culprit talks to inventory-service's
  # database here. The fault library holds that true by stopping the load
  # generator (the only other client: it reaches the database through GET
  # /products, as the inventory role) before the walk and through verify;
  # /ready reads no database. probe.db.statements_per_request checks the
  # declaration with a quiet window before every request it brackets, and is
  # inconclusive when another client called in it. Never declare a shared
  # environment isolated (docs/LIMITS.md, "Statements per item").
  faults-inventory-isolated:
    adapter: process
    isolated: true
    components:
      inventory-service:
        database: {dsn_env: CULPRIT_INVENTORY_STATS_DSN}
    endpoints: *fault-endpoints
    grants:
      net.dns.resolve: true
      net.tcp.connect: true
      net.http.outbound: true
      config.read.names: true
      db.stats.read: true
      db.plan.read: true
  # inventory-service's database read from wherever culprit runs, with
  # CULPRIT_INVENTORY_DSN naming a reader's connection string: its live
  # schema (`culprit env capture local-inventory`), its statements and its
  # plans. The database name is derived: inventory-db (Q34).
  local-inventory:
    adapter: process
    components:
      inventory-service:
        database: {dsn_env: CULPRIT_INVENTORY_DSN}
    grants:
      db.metadata.read: true
      db.stats.read: true
      db.plan.read: true
  # `just quickstart`'s own run: the same vantage and grants as
  # faults-order, against the quickstart's demo services (same host names
  # and ports), under the name the dashboard will show.
  quickstart:
    adapter: process
    components: *order-vantage
    endpoints: *fault-endpoints
    grants: *token-grants

# --- Phase 32: the fault library ------------------------------------------
#
# What the demo declares, so the isolation walk has INTENT to compare
# against. Each is a rank-100 assertion (an invariant), because the demo
# deliberately has no `extract:` (see above).
invariants:
  - subject: "auth:order-service->inventory-service/audience"
    predicate: audience
    value: inventory-service
    why: >-
      inventory-service accepts only tokens minted for it
      (EXPECTED_AUDIENCE); the audience fault is order-service presenting
      one minted for another.
  - subject: "http:inventory-service/GET /stock"
    predicate: exists
    why: inventory-service serves stock levels at this route.
  - subject: "http:inventory-service/GET /stock"
    predicate: calls
    why: order-service reads stock here before it reserves.
  - subject: "config:payments-service/PAYMENTS_PROVIDER_KEY"
    predicate: required
    value: true
    why: payments-service cannot charge anyone without its provider key.
  # Phase 36: the route the budget below is on. The walk already asks it at
  # inventory-service (environments, health_path), but nothing declared it
  # as INTENT, so a budget there would have pointed at nothing.
  # Phase 37 part 3: the list route, so its budget below points at a route
  # the model declares (extraction here reads the schema only).
  - subject: "http:inventory-service/GET /products"
    predicate: exists
    why: >-
      inventory-service lists one category's products here, from its own
      database; with no category asked for, the featured one.
  # Phase 39 part 2: the N+1 fault's route, so its budgets below point at a
  # route the model declares.
  - subject: "http:inventory-service/GET /products/details"
    predicate: exists
    why: >-
      inventory-service lists the first page of products here, each with its
      details from its own database (product_details, one row per product).
  - subject: "http:inventory-service/GET /ready"
    predicate: exists
    why: >-
      inventory-service answers readiness here, through the fault
      middleware, unlike /health.

# --- Phase 36: latency budgets ----------------------------------------------
#
# How fast a route must be, declared, so a measured latency has something
# to diverge from (docs/PERFORMANCE_PLAN.md P1). Culprit never chooses a
# budget for you; this one is the demo's own declaration.
budgets:
  - subject: "http:inventory-service/GET /ready"
    predicate: latency_p95_ms
    value: 300
    why: >-
      The route the isolation walk already asks at inventory-service,
      because it passes through the fault middleware. GET /stock, the
      route order-service actually calls, needs a token, and no probe
      presents one (docs/LIMITS.md). 300 ms is well clear of both a healthy
      answer (milliseconds, on the same Docker network) and the fault
      library's injected 800 ms.
  - subject: "schema:inventory-db/public.products"
    predicate: query_mean_ms_max
    value: 10
    why: >-
      GET /products reads the first 50 of one category's products in sku
      order, from a million seeded rows in 200 interleaved categories.
      Without an index led by category, Postgres walks the sku index and
      filters category row by row: under a millisecond for a seeded
      category, which matches every ~200 skus, but the whole index for a
      category with no products, such as the storefront's featured new
      one, because the walk never stops. An index on category alone is not
      used for it. With one on (category, sku) it takes about 0.006 ms.
      The demo's traffic is half the empty category, so a window's mean is
      about half the walk. The walk's cost is the machine's speed: the
      window's mean without the index has measured 28.2 to 63.8 ms across
      CI's runners and 46 to 133 ms on a developer's machine, and 0.1 to
      0.96 ms with it (PostgreSQL 16, Q35, Q37). 10 ms guards the index the
      list route depends on: the fault's smallest mean is 2.8 times it,
      and health stays under 2 ms. It was 20 ms until Q37: on one fast
      runner the fault's mean, 28.2 ms, fell under 1.5 times that.
  - subject: "http:inventory-service/GET /products"
    predicate: latency_p95_ms
    value: 25
    why: >-
      Phase 37 part 3, moved by Q37. Measured on the fault library's
      stack, GET /products for the featured category (which has no
      products) with the products traffic running: the p95 at the healthy
      head (0003) has been 3 to 8 ms (7.9 ms the slowest, on a developer's
      machine), and with the database at 0002, without the index, 68.4 ms
      the smallest in CI and 108.5 ms timed by hand. 25 ms keeps the
      slowest healthy p95 37% under half the budget and the fault's
      smallest p95 37% over twice it. It was 30 ms until Q37, when one
      runner's fault p95 came within 14% of twice the budget.
  - subject: "http:inventory-service/GET /products"
    predicate: response_items_max
    value: 50
    at: /products
    why: >-
      Phase 38 part 2. GET /products answers one page of a category, in an
      envelope ({"category", "products"}), 50 products unless the caller
      asks for more with ?limit=, which the route caps at 200. A probe
      sends no query (docs/PROBES.md), so what is counted is the default
      page, of the featured category, which is empty by design (Q35): the
      probe passes with 0. The bound guards the default page size the
      storefront relies on.
  - subject: "http:inventory-service/GET /products/details"
    predicate: latency_p95_ms
    value: 25
    why: >-
      Phase 39 part 2. PROVISIONAL: to be set from the spread measured
      across CI's runners (Q37), against the default page of 200.
  - subject: "http:inventory-service/GET /products/details"
    predicate: response_items_max
    value: 200
    at: /products
    why: >-
      Phase 39 part 2. GET /products/details answers the first 200 products
      with their details, in an envelope ({"products"}), and caps ?limit= at
      200, as GET /products does. A probe sends no query, so what is counted
      is that default page, which holds 200 items. The bound guards the page
      the route's latency budget is measured against: a larger page costs
      more. It is 200, not 50, because at 50 an N+1 cost too little to tell
      from the join by a budget with Q37's margins.
