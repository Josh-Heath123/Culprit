# The demo system, described declaratively (Phase 27, field 15).
#
# This replaces infra/demo-services.yaml, and it replaces
# shared/culprit_shared/services.py's DEMO_SERVICE_ADJACENCY, which was
# the last hardcoded copy of this topology in Python (Phase 27, field 6).
# Applied by docker-compose.quickstart.yml's one-shot `bootstrap` service
# via `apply_model.py`, and by `just apply-model demo-services/culprit.yaml`
# locally.
#
# It lives here, next to the services it describes, rather than at the
# repository root. Phase 27's field 10 says "culprit.yaml at repo root
# becomes the canonical model source" — that is the convention for a
# *user's* repository, where the root is the system being modelled. This
# repository's root is Culprit itself, which is not the system these
# three toy services make up. Putting it here keeps "the manifest sits at
# the root of the thing it describes" true, which is the rule the
# convention is actually for.
#
# Two things are deliberately different from the pre-Phase-27
# demo-services.yaml, and both are the point of the phase:
#
#   * `kind` is now stated. order-service, inventory-service and
#     payments-service are all services; if the demo ever grows a
#     database or a queue, that becomes expressible here rather than
#     being flattened into "another service".
#   * `criticality` is stated as on_request_path, which the old schema
#     could not record at all. Every edge here really is on the path a
#     POST /orders takes — see demo-services/order_service/main.py, which
#     calls both dependencies synchronously while handling the request.
#     That is what lets `GET /model/graph?symptom=order-service` return a
#     request path rather than a shrug.
#
# monitored_metrics is left empty on all three: "[] means score every
# metric seen" (Phase 14) is already right for the demo services' small,
# known metric set.
#
# The edges reproduce exactly the four-edge adjacency that
# api/migrations/versions/635870479f4e_create_service_registry.py
# backfills on a live database — order-service is connected to both
# inventory-service and payments-service, and each of those back to
# order-service. Stored per direction because a connection is directed;
# see docs/SELF_HOSTED_PLAN.md Phase 14's schema section.
version: 1
components:
  - name: order-service
    kind: service
    display_name: Order Service
    monitored_metrics: []
    connections:
      - to: inventory-service
        kind: http
        criticality: on_request_path
      - to: payments-service
        kind: http
        criticality: on_request_path

  - name: inventory-service
    kind: service
    display_name: Inventory Service
    monitored_metrics: []
    connections:
      - to: order-service
        kind: http
        criticality: on_request_path

  - name: payments-service
    kind: service
    display_name: Payments Service
    monitored_metrics: []
    connections:
      - to: order-service
        kind: http
        criticality: on_request_path

# No `extract:` section here, deliberately (Phase 28 field 10).
#
# These three services share one uv project and one virtualenv, and each
# imports the sibling `shared/` package. Extraction runs per component
# with that component's own directory as the root, so importing
# `order_service/main.py` from inside `order_service/` fails on
# `import shared` — the extractor reports exactly that, which is honest
# but useless. Giving all three the same root instead would attribute
# every service's config keys to all three: a confidently wrong fact
# rather than a missing one, which is the worse of the two.
#
# The repository's own root `culprit.yaml` is where extraction is
# dogfooded — `api/` and `frontend/` are a real Python+React pair with a
# real layout, which is what acceptance criterion 1 is about. This file
# stays what it has always been: the demo system's *topology*, applied
# with `just apply-model`.

# --- Phase 31: probing the running demo stack -------------------------
#
# `environments:` exists here so Phase 31's acceptance criterion 1 is an
# executable command rather than a description:
#
#   just demo-up   # or: just quickstart
#   cd cli && go run ./cmd/culprit probe \
#       'connection:order-service->inventory-service' \
#       -f ../demo-services/culprit.yaml --env local
#
# Without it, `--env` cannot be passed, nothing is granted, and every
# probe correctly refuses — which is the permission model working, and
# also a demonstration of nothing. The audit of this phase found exactly
# that.
#
# `local` grants only the four read capabilities the network and HTTP
# probes need, against a stack on this machine. It grants no
# config.read.values, no db.rows.read, and there is no *.write
# capability to grant. `adapter: process` because the probe reads its
# own environment; probes dial from wherever the CLI runs, which for a
# local Compose stack is the published ports (see docs/LIMITS.md,
# "Probes run from wherever you run them").
environments:
  local:
    adapter: process
    # One component, because `process` captures the environment culprit
    # itself runs in and that belongs to exactly one. It does not limit
    # what can be probed: a probe's target comes from the command line,
    # and the grants below apply to the environment, not to this entry.
    components:
      order-service: {}
    grants:
      net.dns.resolve: true
      net.tcp.connect: true
      net.tls.inspect: true
      net.http.outbound: true
