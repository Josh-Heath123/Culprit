[project]
name = "signalstack-demo-services"
version = "0.1.0"
description = "Three toy services + load generator + fault injector that produce the telemetry SignalStack correlates"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "python-dotenv>=1.0",
    "culprit-shared",
]

[tool.uv]
package = false

[tool.uv.sources]
culprit-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.383",
]
