[project]
name = "signalstack-api"
version = "0.1.0"
description = "SignalStack API service (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "opentelemetry-proto>=1.27",
    "redis>=5.1",
    "arq>=0.28.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "culprit-shared",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
culprit-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "pyright>=1.1.383",
    # Phase 14: the first real HTTP-level integration tests
    # (test_registry_api.py) drive the registry router through FastAPI's
    # TestClient, which needs httpx installed even though app code never
    # imports it directly.
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# Phase 22 (docs/AI_NATIVE_PLAN.md): scripts/tests/ has no pyproject.toml
# or venv of its own -- its two check scripts already run via api's venv
# (`uv run --project api python scripts/check_*.py`, see
# scripts/check_schema_drift.py's own established precedent), so their
# tests ride along on api's pytest run rather than needing a third test
# entry point. "tests" must stay listed explicitly once testpaths is
# set, or api/tests/ itself stops being discovered.
testpaths = ["tests", "../scripts/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Phase 14's integration tests share session-scoped async fixtures
# (api/tests/conftest.py's db_engine, migrated_database_url) — asyncpg
# connections are bound to the event loop they were created on, so a
# fresh per-test loop (pytest-asyncio's default) breaks any pooled
# connection the moment a second test reuses it. One event loop for the
# whole session avoids that entirely.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
