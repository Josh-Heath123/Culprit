[project]
name = "culprit-mcp-server"
version = "0.1.0"
description = "Local stdio MCP server exposing Culprit's engineering memory (Phase 21-23) as read-only tools for a coding agent (Phase 24, docs/AI_NATIVE_PLAN.md)"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    # Pinned below 2.0 deliberately: mcp 2.x renames FastMCP -> MCPServer
    # and restructures mcp.server.fastmcp entirely (verified directly
    # against the installed package, not assumed) -- 1.x is what every
    # current MCP client/tutorial, including the mcp-builder skill this
    # phase was built against, actually documents.
    "mcp>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.5.0",
    "voyageai>=0.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.7",
    "pyright>=1.1.383",
]

[tool.pyright]
# Same reasoning as [tool.pytest.ini_options]'s own pythonpath below --
# pyright doesn't read pytest's ini option, so it needs its own
# equivalent to resolve `from mcp_server import tools` inside tests/.
extraPaths = [".."]

[tool.pytest.ini_options]
# ".." (the repo root), not "." -- mcp_server/ is a *flat* package
# (pyproject.toml beside __init__.py, not one level above it), so tests
# importing `from mcp_server import tools` need the repo root on
# sys.path, the same way `python -m mcp_server` does at runtime (see
# this project's own Dockerfile and docs/AI_NATIVE_INSTRUMENTATION.md
# for the same reasoning). "." would instead make `tools`/`config`/
# `server` resolve as bare top-level module names, which breaks their
# own internal relative imports (`from .config import ...`).
pythonpath = [".."]

