[project]
name = "signalstack-worker"
version = "0.1.0"
description = "SignalStack background worker (arq)"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "arq>=0.26",
    "redis>=5.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "river>=0.21",
    "networkx>=3.3",
    "voyageai>=0.5.0",
    "pgvector>=0.5.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "culprit-shared",
    # Phase 35 part 2: the narrator's providers speak plain HTTP. Already in
    # this lockfile (under voyageai and opentelemetry); declared because
    # app.narrate imports it, and only app.narrate may (the contract below).
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.uv.sources]
culprit-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.15",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "pyright>=1.1.383",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.importlinter]
# Two roots, not one: `culprit_model` (Phase 26) lives in shared/ and is
# installed into this venv as a path dependency, so the graph can reach
# it from here — and docs/DIAGNOSTIC_PLAN.md §3's standing invariant 6
# says every new deterministic package joins this contract in the commit
# that creates it. scripts/check_no_llm_imports.py covers the same
# package from the other direction (source text, no venv needed); this
# one follows the real import graph, including transitive reaches.
root_packages = ["app", "culprit_model"]
# Required for the contract below to name `anthropic`/`voyageai`/
# `google.genai` at all -- import-linter refuses external forbidden
# modules without it.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "anomaly detection stays isolated from RAG/LLM"
type = "forbidden"
source_modules = ["app.anomaly"]
forbidden_modules = ["app.rag"]

[[tool.importlinter.contracts]]
name = "RAG/LLM stays isolated from anomaly detection"
type = "forbidden"
source_modules = ["app.rag"]
forbidden_modules = ["app.anomaly"]

# Phase 23 (docs/AI_NATIVE_PLAN.md, invariant 8): app.memory reads
# correlation's *output* (incident_candidates/anomalies rows), never an
# LLM. Deliberately one-directional, unlike the pair above -- nothing in
# Phases 21-25 needs app.rag -> app.memory forbidden too (Known Trap 4),
# and adding it preemptively would be exactly the kind of speculative
# rule invariant 8's own "don't build a more elaborate rules engine than
# justified" reasoning warns against.
[[tool.importlinter.contracts]]
name = "engineering memory stays isolated from RAG/LLM"
type = "forbidden"
source_modules = ["app.memory"]
forbidden_modules = ["app.rag"]

# Phase 26 (docs/DIAGNOSTIC_PLAN.md, .claude/rules/determinism.md): the
# core model is comparison machinery -- subject construction,
# canonicalisation, Fact/Divergence validation. Every one of those must
# give the same answer twice, which an LLM cannot promise. Listed
# transitively (app.rag as well as the SDKs) because this repo's own RAG
# package is the shortest route to a model call.
[[tool.importlinter.contracts]]
name = "the three-plane core model stays deterministic"
type = "forbidden"
source_modules = ["culprit_model"]
# `google`, not `google.genai`: import-linter cannot name a subpackage
# of an external distribution, and the whole namespace is a fine thing
# for a canonicalisation library to be barred from anyway.
forbidden_modules = ["app.rag", "anthropic", "voyageai", "google"]

# Phase 35 part 2 (docs/DIAGNOSTIC_PLAN.md, D8): the narrator is the one LLM
# call in the system, and these two contracts are what make that a build
# failure rather than a convention. Their source lists name every package
# under app/ except app.narrate itself and app.main (which only schedules
# it), plus culprit_model; worker/tests/test_narrate_boundary.py fails when
# a package is added to app/ and not to both lists (standing invariant 9).
#
# Only app.narrate may talk to a provider: no other package may import an
# HTTP client or a model SDK. (app.rag reaches Voyage through voyageai's
# own client, which is an embedding call, held by the contracts above.)
[[tool.importlinter.contracts]]
name = "only the narrator talks to a provider"
type = "forbidden"
source_modules = [
    "app.anomaly",
    "app.consumer",
    "app.db",
    "app.env",
    "app.memory",
    "app.observability",
    "app.rag",
    "culprit_model",
]
forbidden_modules = ["httpx", "anthropic", "openai", "ollama", "aiohttp", "requests"]

# Nothing downstream reads a narration: no package may import app.narrate,
# where the narrations table and the providers live.
[[tool.importlinter.contracts]]
name = "nothing downstream reads a narration"
type = "forbidden"
source_modules = [
    "app.anomaly",
    "app.consumer",
    "app.db",
    "app.env",
    "app.memory",
    "app.observability",
    "app.rag",
    "culprit_model",
]
forbidden_modules = ["app.narrate"]
