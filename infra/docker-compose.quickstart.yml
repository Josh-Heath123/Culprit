# Local quickstart (Phase 17) -- distinct from docker-compose.yml (local
# dev infra only: Postgres/Redis/Grafana/Tempo, no app containers) and
# docker-compose.prod.yml (pulls published ghcr.io images, no bind
# mounts, no demo services -- see docs/SELF_HOSTED_PLAN.md Phase 17's
# Known Trap 2 for why the *default* values differ between this file and
# prod's, and why the live culprit.co.za database is never touched by
# either this file or scripts/bootstrap_env.py).
#
# Builds every image locally from this repo's own Dockerfiles instead of
# pulling from ghcr.io, so `just quickstart` works before any image has
# ever been published and on a machine with no registry access at all.
# Driven by `just quickstart` (see justfile) rather than invoked directly
# -- that recipe sequences bootstrap_env.py --local, a default-profile
# `up`, and a `--profile demo up` as two separate `docker compose`
# invocations, in that order, which matters (see below).
#
# Secrets come from the SAME infra/.env.prod file docker-compose.prod.yml
# reads (scripts/bootstrap_env.py --local generates it) -- there is
# deliberately no separate quickstart-only secrets file.

name: culprit-quickstart

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - quickstart-postgres-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - quickstart-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: ${DASHBOARD_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest-gateway:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: uvicorn app.ingest_gateway.main:app --host 0.0.0.0 --port 8010
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: ${WORKER_INGESTION_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    env_file: .env.prod
    ports:
      # Plain HTTP only -- bootstrap_env.py --local writes
      # DOMAIN=http://localhost, which makes frontend/Caddyfile's
      # {$DOMAIN:localhost} site address explicit-scheme, so Caddy skips
      # automatic HTTPS/Let's Encrypt entirely instead of trying (and
      # failing, with no real domain) to get a certificate. No 443
      # published -- there is nothing serving TLS here.
      - "80:80"
    volumes:
      - quickstart-caddy-data:/data
      - quickstart-caddy-config:/config
    depends_on:
      - api
      - ingest-gateway

  # One-shot: migrate, apply the demo system model (writing the
  # freshly-issued API keys to demo-services/.env for the demo profile
  # below to pick up), create the quickstart admin user. Exits 0 and
  # stops -- `restart: "no"` is deliberate, this is not a long-running
  # process. Idempotent: alembic upgrade head and apply_model.py are
  # both no-ops on an unchanged/already-applied state; the create_user
  # step explicitly checks for an existing user first and skips itself
  # rather than erroring a second time (docs/SELF_HOSTED_PLAN.md Phase 17
  # Known Trap 3).
  bootstrap:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: "no"
    env_file: .env.prod
    environment:
      DATABASE_URL: ${DASHBOARD_DATABASE_URL}
    volumes:
      - ../demo-services:/demo-services-env
      # Phase 27: the demo topology is a culprit.yaml living next to the
      # services it describes, not infra/demo-services.yaml.
      - ../demo-services/culprit.yaml:/config/culprit.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        echo "==> Running database migrations"
        alembic upgrade head

        echo "==> Applying the demo system model"
        python -m scripts.apply_model /config/culprit.yaml | tee /tmp/apply-output.txt

        {
          echo "# Generated by the quickstart bootstrap step -- do not hand-edit."
          echo "# See infra/docker-compose.quickstart.yml's bootstrap service."
          grep '^created component order-service: ' /tmp/apply-output.txt | sed -E 's/^created component order-service: (.+)$/ORDER_SERVICE_API_KEY=\1/'
          grep '^created component inventory-service: ' /tmp/apply-output.txt | sed -E 's/^created component inventory-service: (.+)$/INVENTORY_SERVICE_API_KEY=\1/'
          grep '^created component payments-service: ' /tmp/apply-output.txt | sed -E 's/^created component payments-service: (.+)$/PAYMENTS_SERVICE_API_KEY=\1/'
        } > /demo-services-env/.env.new

        if [ "$(grep -c '^[A-Z]' /demo-services-env/.env.new)" -eq 3 ]; then
          mv /demo-services-env/.env.new /demo-services-env/.env
          echo "wrote demo-services/.env with 3 freshly-issued keys"
        else
          rm -f /demo-services-env/.env.new
          echo "demo services already registered; keeping existing demo-services/.env"
        fi

        # create_user.py exits 1 (with "username already exists" on
        # stderr) on a repeat run -- that IS the idempotency guard
        # (docs/SELF_HOSTED_PLAN.md Phase 17 Known Trap 3), not a
        # bootstrap failure, so it's handled with if/else rather than
        # set -e. The generated password is piped into stdin, never
        # passed as an argument -- see api/scripts/create_user.py's own
        # docstring for why it only ever accepts the password
        # interactively, and scripts/bootstrap_env.py's docstring for why
        # piping satisfies that without editing create_user.py itself.
        echo "==> Creating the quickstart admin user (skipped if it already exists)"
        if printf '%s\n%s\n' "$QUICKSTART_ADMIN_PASSWORD" "$QUICKSTART_ADMIN_PASSWORD" | python -m scripts.create_user "$QUICKSTART_ADMIN_USERNAME" --role admin; then
          echo "created admin user $QUICKSTART_ADMIN_USERNAME"
        else
          echo "user $QUICKSTART_ADMIN_USERNAME already exists (or creation failed) -- not treating this as a bootstrap failure"
        fi

        echo "==> Bootstrap complete"

  # Demo profile (Phase 2 services as containers, Phase 17 addition) --
  # only started by `docker compose --profile demo up`, run as the
  # SECOND `docker compose` invocation in `just quickstart`, strictly
  # after the `bootstrap` service above has already written
  # demo-services/.env with real keys. Production's compose file has no
  # equivalent of any of this, on purpose (CLAUDE.md: demo-services was
  # deliberately never added to docker-compose.prod.yml).
  order-service:
    build:
      context: ..
      dockerfile: demo-services/Dockerfile
    command: uvicorn order_service.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    env_file: ../demo-services/.env
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8002
      PAYMENTS_SERVICE_URL: http://payments-service:8003
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://ingest-gateway:8010
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://ingest-gateway:8010
      # worker/app/anomaly/scorer.py's MIN_OBSERVATIONS=30 warm-up is
      # counted in exported metric points, not wall-clock time -- at the
      # 10s default (demo-services/shared/otel.py) that's a 5-minute
      # warm-up before the scorer can flag *anything*, on top of however
      # long it then takes to notice a fault, blowing past "an incident
      # within ~5 minutes." Quickstart-only override (not touched for
      # native `just demo-order` etc., and not any change to the scorer's
      # own logic/thresholds -- those stay exactly as Phase 4 built them).
      OTEL_METRIC_EXPORT_INTERVAL_MS: "2000"
    depends_on:
      - ingest-gateway
    profiles: ["demo"]

  inventory-service:
    build:
      context: ..
      dockerfile: demo-services/Dockerfile
    command: uvicorn inventory_service.main:app --host 0.0.0.0 --port 8002
    restart: unless-stopped
    env_file: ../demo-services/.env
    environment:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://ingest-gateway:8010
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://ingest-gateway:8010
      OTEL_METRIC_EXPORT_INTERVAL_MS: "2000"
    depends_on:
      - ingest-gateway
    profiles: ["demo"]

  payments-service:
    build:
      context: ..
      dockerfile: demo-services/Dockerfile
    command: uvicorn payments_service.main:app --host 0.0.0.0 --port 8003
    restart: unless-stopped
    env_file: ../demo-services/.env
    environment:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://ingest-gateway:8010
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://ingest-gateway:8010
      OTEL_METRIC_EXPORT_INTERVAL_MS: "2000"
    depends_on:
      - ingest-gateway
    profiles: ["demo"]

  load-generator:
    build:
      context: ..
      dockerfile: demo-services/Dockerfile
    command: python load_generator.py
    restart: unless-stopped
    environment:
      ORDER_SERVICE_URL: http://order-service:8001
    depends_on:
      - order-service
    profiles: ["demo"]

volumes:
  quickstart-postgres-data:
  quickstart-redis-data:
  quickstart-caddy-data:
  quickstart-caddy-config:
