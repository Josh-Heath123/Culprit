# The five-component demo: three services — a real FastAPI service, a
# real React frontend and a small billing service — and the two
# databases behind them (orders-db, billing-db), checked against each
# other.
#
# The component trees are `cli/testdata/fixtures/fastapi-orders` and
# `cli/testdata/fixtures/react-web`, reused rather than copied. Each has
# its own single-component `culprit.yaml` for the Phase 28 extraction
# tests; this one puts them in the same system so there is something to
# compare. It is what the README's example output comes from, and it runs
# end to end through the real extractors — no committed fact bundle, no
# stub.
version: 1

components:
  - name: web
    kind: frontend
    display_name: Storefront
    connections:
      - to: orders-api
        kind: http
        criticality: on_request_path
  - name: orders-api
    kind: service
    display_name: Orders API
    connections:
      - to: orders-db
        kind: sql
        criticality: on_request_path
  - name: orders-db
    kind: database
  # A deliberately faulty component -- see billing/README.md. The other
  # two are the Phase 28 extraction fixtures, which are correct, and a
  # corpus of correct fixtures cannot show that the tool finds anything.
  - name: billing-api
    kind: service
    display_name: Billing API
    connections:
      - to: billing-db
        kind: sql
        criticality: on_request_path
  - name: billing-db
    kind: database

extract:
  extractors:
    - name: python
      # Run out of this repository's own extractor project. Each
      # extractor is launched with its component root as the working
      # directory, so the path is relative to
      # cli/testdata/fixtures/fastapi-orders/ - five levels up.
      command: ["uv", "run", "--project", "../../../../extractors/python", "culprit-extract-python", "--app", "orders_api.main:app"]
    - name: python-billing
      # Same depth as the fixture components (cli/testdata/demo/billing),
      # but a different --app, so it needs its own entry.
      command: ["uv", "run", "--project", "../../../../extractors/python", "culprit-extract-python", "--app", "main:app"]
    - name: node
      # Same idea, without uv: the Node extractor is plain JavaScript.
      command: ["node", "../../../../extractors/node/src/cli.js", "--client-fn", "apiRequest"]
  components:
    orders-api:
      root: ../fixtures/fastapi-orders
      extractors: [python]
    billing-api:
      root: billing
      extractors: [python-billing]
    web:
      root: ../fixtures/react-web
      extractors: [node]
      calls_to: orders-api

# Phase 30: two environments to capture and diff — see
# environments/compose.yml. `culprit diff staging production` from this
# directory, with both Compose projects up, reproduces docs/demos/phase-30.md.
#
# The grants are what they would be for a real deployment someone
# trusts culprit with the shape of: names and shapes of config, image
# metadata, and schema metadata. Not config values, not the network.
environments:
  staging:
    adapter: compose
    compose:
      project: culprit-demo-staging
      files: [environments/compose.yml, environments/staging.yml]
    grants:
      config.read.names: true
      deploy.metadata.read: true
      db.metadata.read: true
    components:
      orders-api:
        database:
          # The *name* of a variable in the shell culprit runs in, holding
          # a connection string to this environment's database. Never the
          # connection string: culprit.yaml is committed.
          dsn_env: CULPRIT_DEMO_STAGING_DB_URL
  production:
    adapter: compose
    compose:
      project: culprit-demo-production
      files: [environments/compose.yml, environments/production.yml]
    grants:
      config.read.names: true
      deploy.metadata.read: true
      db.metadata.read: true
    components:
      orders-api:
        database:
          dsn_env: CULPRIT_DEMO_PRODUCTION_DB_URL
