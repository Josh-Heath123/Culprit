# Phase 22 (docs/AI_NATIVE_PLAN.md): files declared "must change
# together" -- checked by scripts/check_coupled_files.py, wired into
# .claude/hooks/check_invariants.sh (real-time) and CI (the actual
# gate). Seeded with exactly the one pairing scripts/check_schema_drift.py
# already encodes as a hardcoded case; this file's job is to make that
# relationship declarable for future pairs, not to invent new pairs
# speculatively (see that phase's own Out of scope).
pairs:
  - [worker/app/db.py, api/app/db/models.py]

  # History, not a pair. Phase 28 added a second one here: the closed
  # `ValueShape` type (shared/culprit_model/shape.py) against the migration
  # that writes its vocabulary out as literals for the
  # `*_value_shape_is_closed` CHECK constraints (d1f4a9c73b60, retargeted in
  # Phase 30 to e4c1b7a9d2f0). Replaced in Phase 43's close-out (Q43,
  # 2026-11-20): it tested whether a file moved, not whether the two
  # vocabularies agree, so any edit to the migration passed it, and the
  # first change to shape.py that touched no vocabulary (Q42's classifier
  # fix) could pass it only by editing an applied migration, adding an empty
  # one, or loosening the gate. A check that can be passed only by gaming it
  # is a defect. The agreement is now held by content, in both directions,
  # with no database: api/tests/test_value_shape_vocabulary.py walks the
  # Alembic chain by AST and compares the latest migration naming the
  # constraint with the four enums; it follows a later rebuild without being
  # edited. api/tests/test_value_shape_constraint.py still proves the
  # database accepts every shape the model can produce.
  #
  # Still deliberately NOT declared here: the three subject-construction
  # implementations against shared/tests/*conformance.json. The coupling is
  # real but one-directional; each implementation's own test suite reads
  # the fixture, so a change that breaks conformance fails that language's
  # tests immediately.
