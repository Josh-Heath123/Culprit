# Phase 22 (docs/AI_NATIVE_PLAN.md): files declared "must change
# together" -- checked by scripts/check_coupled_files.py, wired into
# .claude/hooks/check_invariants.sh (real-time) and CI (the actual
# gate). Seeded with exactly the one pairing scripts/check_schema_drift.py
# already encodes as a hardcoded case; this file's job is to make that
# relationship declarable for future pairs, not to invent new pairs
# speculatively (see that phase's own Out of scope).
pairs:
  - [worker/app/db.py, api/app/db/models.py]

  # Phase 28. The closed `ValueShape` type and the CHECK constraint that
  # mirrors it. The migration writes the enum members out as literals
  # because a migration must not import mutable application code
  # (.claude/rules/database.md), so adding a member to the type without
  # touching the migration produces a value the type can construct and
  # the database will refuse.
  #
  # Genuinely bidirectional, which is what makes it a fair pair for a
  # symmetric check: neither side may move alone.
  #
  # Deliberately NOT declared here: the three subject-construction
  # implementations against shared/tests/*conformance.json. The coupling
  # is real but it is one-directional — changing an implementation should
  # require touching the fixture, while *adding a case* to the fixture is
  # the normal way to extend the suite and must not require editing three
  # implementations that already handle it. A symmetric check would
  # forbid the second, and the first is already gated harder: each
  # implementation's own test suite reads the fixture, so a change that
  # breaks conformance fails that language's tests immediately.
  #
  # Retargeted in Phase 30 from d1f4a9c73b60 to e4c1b7a9d2f0, when `scheme`
  # joined the type and the constraint was rebuilt. The pair names the
  # migration that *currently defines* the vocabulary, because that is the
  # file that has to move with the type; a historical migration already
  # applied in production is a snapshot and is never edited to satisfy
  # this check. The next migration to rebuild the constraint retargets it
  # again, in the same commit.
  - [shared/culprit_model/shape.py, api/migrations/versions/e4c1b7a9d2f0_environment_capture.py]
